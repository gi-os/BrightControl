name: Check

# Everything build.yml does up to the point where it would publish, on any branch that is not
# main. There is no way to build an APK in the Cowork sandbox — aapt2 ships x86_64-only for
# Linux — so a change worked on there has never been compiled by anything until it is pushed.
# Without this the only way to find out was to push to main, which installs onto a phone within
# minutes, and this app is a key filter: a build that does not run is a phone whose buttons
# might not either.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# Reads the checkout and nothing else. This workflow publishes nothing and uploads no APK —
# a release build here would be signed with the debug key, because the release keystore is a
# secret that only build.yml restores.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # assembleRelease rather than a bare compile: manifest merge and resource processing are
      # where a missing class or a permission that does not exist actually surface, and a Kotlin
      # compile never reaches either.
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
