name: Build & Release APK

on:
  # main only. This workflow publishes a v-tagged release that BrightMarket and
  # Obtainium both offer to everyone within minutes, and a bare `push:` meant every
  # feature branch shipped one -- half-finished work reaching phones because someone
  # pushed a branch to get it compiled. check.yml is what runs on branches; it does
  # everything up to the publish and nothing after it.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # versionCode is the workflow run number, so every push produces a newer
      # build and `adb install -r` upgrades in place instead of erroring.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      # Pushes go straight to main by policy, and check.yml is branches-ignore: [main] — so
      # until this step existed the whole suite never once ran on a commit that shipped. The
      # things it covers are the things that fail silently on a phone: which grant request is
      # refused, whether a colour write was overwritten, how a shake is counted.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}

      # The signing key is a secret, not a file in the repo. Written here and nowhere else; the
      # path is gitignored so a local checkout cannot commit it back by accident.
      - name: Restore signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > keystore/lightcontrol.jks
          # A missing or truncated secret would otherwise fall through to a debug-signed release
          # that the fingerprint step rejects with a confusing message. Fail here, where the
          # cause is obvious.
          test -s keystore/lightcontrol.jks || { echo '::error::KEYSTORE_B64 is empty'; exit 1; }

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          # Shake-to-report posts issues with this. Absent, the build still works —
          # reports queue on the phone until a build that has the key installs over it.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Collect APK
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out debugout
          cp app/build/outputs/apk/release/app-release.apk "out/LightControl-v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "debugout/LightControl-v$V-debug.apk"
          ls -la out debugout

      # Android identifies an app by (packageName, signing cert). If the cert ever
      # changes, Obtainium updates fail with an opaque "Failure: Invalid", so pin it.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs out/*.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' ')
          EXPECTED=$(tr -d ' :\n' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo '::error::signing certificate drifted'; exit 1; }

      # AGP shortens resource paths in release builds, so ic_launcher.png is renamed
      # to something like res/AB.png inside the zip. Ask the package what its icon is
      # instead of grepping filenames — the same lookup Obtainium and the launcher do.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -E "^(application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LightControl-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LightControl-debug-apk
          path: debugout/*.apk
          if-no-files-found: error

      # Only main cuts a release. Any other branch builds and verifies and stops
      # there, which is how a change gets proven before it becomes an update the
      # phone will pull down.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LightControl v${{ steps.ver.outputs.version }}
          files: out/LightControl-v${{ steps.ver.outputs.version }}.apk
          # The written notes are the release. Without this the body is the one
          # auto-generated "Full Changelog" line, which is what BrightMarket then
          # shows as the whole description of the update -- every release since
          # v2.4 read that way on the phone.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          # -w, and the code printed, because the old form said only "index ping
          # failed" and a silent -sf gave no way to tell a bad token from a
          # network blip. INDEX_DISPATCH_TOKEN went stale here and the failure
          # looked identical for weeks: the step is continue-on-error, so the
          # release still went green while the index only picked the app up
          # whenever the 15-minute cron next ran.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}")
          if [ "$code" = "204" ]; then
            echo "index pinged"
          else
            echo "::warning::index ping refused with HTTP $code -- check INDEX_DISPATCH_TOKEN. The 15-minute cron will pick this release up instead."
          fi
